
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>My Glasses Launcher - Test</title>

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: #000000;
      color: #ffffff;
    }

    body {
      width: 600px;
      height: 600px;
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 12px;
      color: #ffffff;
    }

    #status {
      font-size: 19px;
      color: #00d2ff;
      text-align: center;
      margin-bottom: 15px;
      min-height: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 15px;
      flex-grow: 1;
      min-height: 0;
    }

    .app-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #111111;
      border: 2px solid #333333;
      border-radius: 16px;
      color: #ffffff;
      text-decoration: none;
      font-size: 22px;
      font-weight: 500;
      text-align: center;
      padding: 10px;

      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    .app-button:visited {
      color: #ffffff;
    }

    .app-button:hover,
    .app-button:focus-visible {
      background-color: #222222;
      border-color: #00d2ff;
      outline: none;
    }

    .app-button:active {
      background-color: #444444;
      border-color: #ffffff;
    }

    .icon {
      font-size: 40px;
      margin-bottom: 8px;
      pointer-events: none;
    }

    .icon img {
      width: 256px;
      height: 256px;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
    }
  </style>
</head>

<body>

  <h1 id="testTitle">App Launcher</h1>
  <div id="status">Waiting for input...</div>

  <div class="grid">

    <!-- MovieBox Pro -->
    <a href="https://movieboxpro.app"
       class="app-button"
       data-app="MovieBox Pro">
      <span class="icon">
        <img src="mbp.jpg" alt="MovieBox Pro">
      </span>
    </a>

    <!-- YouTube -->
    <a href="https://herald.ascents.gg/a/youtube/"
       class="app-button"
       data-app="YouTube">
      <span class="icon">
        <img src="yt.jpg" alt="YouTube">
      </span>
    </a>

    <!-- ChatGPT -->
    <a href="https://chatgpt.com"
       class="app-button"
       data-app="ChatGPT">
      <span class="icon">
        <img src="chatgpt.jpg" alt="ChatGPT">
      </span>
    </a>

    <!-- Custom App 4 -->
    <a href="https://your-fourth-app-url.com"
       class="app-button"
       data-app="Custom App 4">
      <span class="icon">⚙️</span>
      <span>Custom App 4</span>
    </a>

  </div>

  <script>
    const title = document.getElementById("testTitle");
    const status = document.getElementById("status");

    let eventCount = 0;

    function showEvent(type, detail) {
      eventCount++;

      title.textContent = type + " DETECTED!";
      status.textContent =
        "#" + eventCount + " " + detail;
    }

    // Detect keyboard events from Neural Band
    document.addEventListener("keydown", function(event) {
      showEvent("KEY", event.key);

      if (event.key === "Enter" ||
          event.key === " ") {
        event.preventDefault();
        showEvent("ENTER", event.key);
      }
    }, true);

    // Detect clicks on app buttons
    document.addEventListener("click", function(event) {
      const button = event.target.closest(".app-button");

      if (button) {
        event.preventDefault();
        showEvent(
          "CLICK",
          button.getAttribute("data-app")
        );
      } else {
        showEvent("CLICK", "Page");
      }
    }, true);

    // Detect touch events
    document.addEventListener("touchstart", function(event) {
      showEvent("TOUCH", "Touch started");
    }, { passive: true, capture: true });

    // Detect pointer events
    document.addEventListener("pointerdown", function(event) {
      showEvent(
        "POINTER",
        event.pointerType || "unknown"
      );
    }, true);

    // Detect focus changes
    document.addEventListener("focusin", function(event) {
      const button = event.target.closest(".app-button");

      if (button) {
        status.textContent =
          "Focused: " + button.getAttribute("data-app");
      }
    });

    // Prevent navigation while testing
    document.querySelectorAll(".app-button")
      .forEach(function(button) {
        button.addEventListener("click", function(event) {
          event.preventDefault();
        });
      });
  </script>

</body>
</html>
