
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>My Glasses Launcher</title>

  <style>
    /* Force Dark Mode */
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: #000000;
      color: #ffffff;
    }

    body {
      width: 600px;
      height: 600px;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial,
        sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
      color: #ffffff;
    }

    /* 2x2 Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 15px;
      flex-grow: 1;
      min-height: 0;
    }

    /* Dark Buttons */
    .app-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #111111;
      border: 2px solid #333333;
      border-radius: 16px;
      color: #ffffff;
      text-decoration: none;
      font-size: 22px;
      font-weight: 500;
      text-align: center;
      padding: 10px;

      transition: background-color 0.2s,
                  border-color 0.2s;

      /* Gesture compatibility */
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    .app-button:visited {
      color: #ffffff;
    }

    .app-button:hover,
    .app-button:focus-visible {
      background-color: #222222;
      border-color: #ffffff;
    }

    .app-button:active,
    .app-button.pressed {
      background-color: #444444;
      color: #ffffff;
      border-color: #ffffff;
    }

    .icon {
      font-size: 40px;
      margin-bottom: 8px;
      pointer-events: none;
    }

    .icon img {
      width: 256px;
      height: 256px;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>

<body>

  <h1>App Launcher</h1>

  <div class="grid">

    <!-- MovieBox Pro -->
    <a href="https://movieboxpro.app"
       class="app-button"
       onclick="openApp(event, this)">
      <span class="icon">
        <img src="mbp.jpg"
             alt="MovieBox Pro">
      </span>
    </a>

    <!-- YouTube -->
    <a href="https://herald.ascents.gg/a/youtube/"
       class="app-button"
       onclick="openApp(event, this)">
      <span class="icon">
        <img src="yt.jpg"
             alt="YouTube">
      </span>
    </a>

    <!-- ChatGPT -->
    <a href="https://accounts.google.com/v3/signin/identifier?opparams=%253Faudience%253D799222349882-ne3i0s9jdm5s0p7ll2d7tlsi1vc1halt.apps.googleusercontent.com&dsh=S1829251932%3A1792677965460326&client_id=799222349882-ne3i0s9jdm5s0p7ll2d7tlsi1vc1halt.apps.googleusercontent.com&nonce=LZ8lUjdGoNcjq0F864AX&o2v=2&redirect_uri=https%3A%2F%2Fauth.openai.com%2Fapi%2Faccounts%2Fcallback%2Fgoogle&response_type=code&scope=openid+profile+email&service=lso&state=4d0ff61c-9f5a-4624-96a4-8c19b790184a&flowName=GeneralOAuthFlow&continue=https%3A%2F%2Faccounts.google.com%2Fsignin%2Foauth%2Fv3%2Fconsent%3Fauthuser%3Dunknown%26part%3DAJi8hANBI2FJKsE9HT-FKxr2wDViSvZ5s2VuEWT5v6RNrisW5PVC0Ln1Lo8GIejzG2iDdCjNMWLoSQ4wrh8xDEe41r0iYIHapT7GmqcZoy00_hRYz6IBhT3NSLSXPktEolQfq9DsXxn1aQ7Cbsx0LrR5TpARwyz829Bi8EzFuI2mlr9YUr0E_LRgmTLOT_2uRpevJrsKS8iFUHl6wnsOau5tTMo-AKsGQcNO9kjjWFengMwIbledFOvilRmUwvqhWEMdP7nuW4NrMSto6BZvBHSNMwGkJa3XR3t9wrciLStS2sMqshWY-5HbQUn2sZXTe7ZT8OziF43qQ5ykaMxYQ5Bwqf347B5nEJPPhmZJne9fMKGiKdzYGvkRZoljrmksamCEIw85nP823Zj7GLibeyYQVfR8hobFCf0b3BR_StrYyoLuCMzwfCH8FyW2iOwz-gwUO1AC_J2bhk-u5L_BvfHfH0F3SSDeaQ%26flowName%3DGeneralOAuthFlow%26as%3DS1829251932%253A1792677965460326%26client_id%3D799222349882-ne3i0s9jdm5s0p7ll2d7tlsi1vc1halt.apps.googleusercontent.com%26requestPath%3D%252Fsignin%252Foauth%252Fv3%252Fconsent%23&app_domain=https%3A%2F%2Fauth.openai.com&rart=ANgoxcf0mGU0bZvO_HuQu9laNDpfCSQZkcuwfqt7MwVI9lx3nX9uZ3hhXJZxy7yM6HiRfx42zQkyC7mben--6VZV62uT97Xs0EYp8IqUWUH5WE2-DbDU88k"
       class="app-button"
       onclick="openApp(event, this)">
      <span class="icon">
        <img src="chatgpt.jpg"
             alt="ChatGPT">
      </span>
    </a>

    <!-- Custom App 4 -->
    <a href="https://your-fourth-app-url.com"
       class="app-button"
       onclick="openApp(event, this)">
      <span class="icon">⚙️</span>
      <span>Custom App 4</span>
    </a>

  </div>

  <script>
    /* Open apps when buttons are activated */
    function openApp(event, button) {
      event.preventDefault();

      // Visual feedback
      button.classList.add("pressed");

      // Navigate in the same browser window
      window.location.assign(button.href);
    }
  </script>

</body>
</html>
