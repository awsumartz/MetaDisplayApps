
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#000000">

  <title>My Glasses Launcher</title>

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 600px;
      height: 600px;
      background: #000000;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 10px;
    }

    #status {
      font-size: 16px;
      color: #00d2ff;
      text-align: center;
      min-height: 24px;
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 15px;
      flex: 1;
      min-height: 0;
    }

    .app-form {
      width: 100%;
      height: 100%;
    }

    .app-button {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111111;
      border: 2px solid #333333;
      border-radius: 16px;
      color: #ffffff;
      cursor: pointer;
      padding: 10px;
      font-family: inherit;
      font-size: 20px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .app-button:focus,
    .app-button:focus-visible {
      outline: none;
      border-color: #00d2ff;
      background: #222222;
    }

    .app-button:active {
      background: #444444;
      border-color: #ffffff;
    }

    .app-button img {
      width: 100%;
      max-width: 220px;
      max-height: 220px;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .app-button span {
      pointer-events: none;
    }
  </style>
</head>

<body>

  <h1>App Launcher</h1>

  <div id="status" aria-live="polite">
    Select an app
  </div>

  <div class="grid">

    <!-- MOVIEBOX PRO -->
    <form
      class="app-form"
      action="https://movieboxpro.app"
      method="GET"
      target="_self"
    >
      <button
        class="app-button"
        type="submit"
        data-app="MovieBox Pro"
      >
        <img src="mbp.jpg" alt="MovieBox Pro">
      </button>
    </form>

    <!-- YOUTUBE -->
    <form
      class="app-form"
      action="https://herald.ascents.gg/a/youtube/"
      method="GET"
      target="_self"
    >
      <button
        class="app-button"
        type="submit"
        data-app="YouTube"
      >
        <img src="yt.jpg" alt="YouTube">
      </button>
    </form>

    <!-- CHATGPT -->
    <form
      class="app-form"
      action="https://chatgpt.com"
      method="GET"
      target="_self"
    >
      <button
        class="app-button"
        type="submit"
        data-app="ChatGPT"
      >
        <img src="chatgpt.jpg" alt="ChatGPT">
      </button>
    </form>

    <!-- FOURTH APP -->
    <form
      class="app-form"
      action="https://your-fourth-app-url.com"
      method="GET"
      target="_self"
    >
      <button
        class="app-button"
        type="submit"
        data-app="Custom App 4"
      >
        <span style="font-size:60px">⚙️</span>
        <span>Custom App 4</span>
      </button>
    </form>

  </div>

  <script>
    const statusText = document.getElementById("status");

    const appButtons =
      document.querySelectorAll(".app-button");

    // Show which app is selected.
    appButtons.forEach(function(button) {

      button.addEventListener("focus", function() {
        statusText.textContent =
          "Selected: " + button.dataset.app;
      });

      button.addEventListener("click", function() {
        statusText.textContent =
          "Opening: " + button.dataset.app;

        // Native form submission handles navigation.
        // No preventDefault() here.
      });

    });

    // Neural Band pinch sends Enter.
    // A focused submit button normally responds
    // to Enter automatically, so we deliberately
    // avoid intercepting the key event.
    document.addEventListener("keydown", function(event) {

      if (event.key === "Enter" && !event.repeat) {

        const selected = document.activeElement;

        if (
          selected &&
          selected.classList.contains("app-button")
        ) {
          statusText.textContent =
            "Submitting: " + selected.dataset.app;
        }

      }

    });

    // Focus first app when launcher loads.
    window.addEventListener("load", function() {
      if (appButtons.length > 0) {
        appButtons[0].focus();
      }
    });
  </script>

</body>
</html>
