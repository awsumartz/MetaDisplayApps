
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>My Glasses Launcher</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      width: 600px;
      height: 600px;
    }

    #launcher {
      width: 600px;
      height: 600px;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    h1 {
      font-size: 28px;
      text-align: center;
      margin: 0 0 10px;
    }

    #status {
      font-size: 16px;
      color: #00d2ff;
      text-align: center;
      min-height: 24px;
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 15px;
      flex: 1;
      min-height: 0;
    }

    .app-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      border: 2px solid #333;
      border-radius: 16px;
      color: white;
      text-decoration: none;
      cursor: pointer;
      padding: 10px;
    }

    .app-button:focus,
    .app-button:focus-visible {
      outline: none;
      border-color: #00d2ff;
      background: #222;
    }

    .app-button img {
      width: 100%;
      max-width: 220px;
      max-height: 220px;
      object-fit: contain;
      pointer-events: none;
    }

    .app-button span {
      pointer-events: none;
    }

    #viewer {
      display: none;
      width: 600px;
      height: 600px;
      position: relative;
      background: #000;
    }

    #toolbar {
      height: 50px;
      background: #111;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 5px 10px;
    }

    #homeButton {
      border: 2px solid #555;
      background: #222;
      color: white;
      border-radius: 10px;
      font-size: 18px;
      padding: 7px 14px;
      cursor: pointer;
    }

    #homeButton:focus,
    #homeButton:focus-visible {
      outline: none;
      border-color: #00d2ff;
    }

    #appTitle {
      font-size: 18px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    #appFrame {
      width: 600px;
      height: 550px;
      border: none;
      background: #000;
    }
  </style>
</head>

<body>

  <div id="launcher">
    <h1>App Launcher</h1>

    <div id="status" aria-live="polite">
      Select an app
    </div>

    <div class="grid">

      <a class="app-button"
         href="https://movieboxpro.app"
         data-app="MovieBox Pro">
        <img src="mbp.jpg" alt="MovieBox Pro">
      </a>

      <a class="app-button"
         href="https://herald.ascents.gg/a/youtube/"
         data-app="YouTube">
        <img src="yt.jpg" alt="YouTube">
      </a>

      <a class="app-button"
         href="https://chatgpt.com"
         data-app="ChatGPT">
        <img src="chatgpt.jpg" alt="ChatGPT">
      </a>

      <a class="app-button"
         href="https://your-fourth-app-url.com"
         data-app="Custom App 4">
        <span style="font-size:60px">⚙️</span>
        <span>Custom App 4</span>
      </a>

    </div>
  </div>

  <div id="viewer">
    <div id="toolbar">
      <button id="homeButton" type="button">
        ⌂ Home
      </button>
      <span id="appTitle"></span>
    </div>

    <iframe
      id="appFrame"
      title="Selected application"
      allow="fullscreen; autoplay; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

  <script>
    const launcher = document.getElementById("launcher");
    const viewer = document.getElementById("viewer");
    const frame = document.getElementById("appFrame");
    const status = document.getElementById("status");
    const title = document.getElementById("appTitle");
    const homeButton = document.getElementById("homeButton");
    const buttons = document.querySelectorAll(".app-button");

    let lastSelected = null;

    function openApp(button) {
      lastSelected = button;

      const url = button.href;
      const appName = button.dataset.app;

      title.textContent = appName;
      status.textContent = "Opening: " + appName;

      launcher.style.display = "none";
      viewer.style.display = "block";

      frame.src = url;

      // Keep the Home button accessible to
      // the Neural Band.
      homeButton.focus();
    }

    function goHome() {
      frame.src = "about:blank";

      viewer.style.display = "none";
      launcher.style.display = "flex";

      status.textContent = "Select an app";

      if (lastSelected) {
        lastSelected.focus();
      }
    }

    buttons.forEach(function(button) {
      button.addEventListener("click", function(event) {
        event.preventDefault();
        openApp(button);
      });
    });

    homeButton.addEventListener("click", goHome);

    document.addEventListener("keydown", function(event) {
      if (event.key !== "Enter" || event.repeat) {
        return;
      }

      const selected = document.activeElement;

      if (
        launcher.style.display !== "none" &&
        selected &&
        selected.classList.contains("app-button")
      ) {
        event.preventDefault();
        openApp(selected);
      }

      // The Home button uses its normal
      // keyboard click behavior.
    });

    window.addEventListener("load", function() {
      if (buttons.length) {
        buttons[0].focus();
      }
    });
  </script>

</body>
</html>
