
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>My Glasses Launcher</title>

  <style>
    /* Dark Mode */
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: #000000;
      color: #ffffff;
    }

    body {
      width: 600px;
      height: 600px;
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 10px;
      color: #ffffff;
    }

    /* Navigation status */
    #status {
      font-size: 16px;
      color: #00d2ff;
      text-align: center;
      min-height: 22px;
      margin-bottom: 10px;
    }

    /* 2x2 App Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 15px;
      flex-grow: 1;
      min-height: 0;
    }

    /* App Buttons */
    .app-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #111111;
      border: 2px solid #333333;
      border-radius: 16px;
      color: #ffffff;
      text-decoration: none;
      font-size: 22px;
      font-weight: 500;
      text-align: center;
      padding: 10px;

      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    .app-button:visited {
      color: #ffffff;
    }

    /* Highlight selected app */
    .app-button:focus,
    .app-button:focus-visible {
      background-color: #222222;
      border-color: #00d2ff;
      outline: none;
    }

    .app-button:active {
      background-color: #444444;
      border-color: #ffffff;
    }

    /* Icons */
    .icon {
      font-size: 40px;
      margin-bottom: 8px;
      pointer-events: none;
    }

    .icon img {
      width: 256px;
      height: 256px;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>

<body>

  <h1>App Launcher</h1>
  <div id="status" aria-live="polite">
    Select an app
  </div>

  <div class="grid">

    <!-- MovieBox Pro -->
    <a href="https://movieboxpro.app"
       class="app-button"
       data-app="MovieBox Pro">
      <span class="icon">
        <img src="mbp.jpg"
             alt="MovieBox Pro">
      </span>
    </a>

    <!-- YouTube -->
    <a href="https://herald.ascents.gg/a/youtube/"
       class="app-button"
       data-app="YouTube">
      <span class="icon">
        <img src="yt.jpg"
             alt="YouTube">
      </span>
    </a>

    <!-- ChatGPT -->
    <a href="https://chatgpt.com"
       class="app-button"
       data-app="ChatGPT">
      <span class="icon">
        <img src="chatgpt.jpg"
             alt="ChatGPT">
      </span>
    </a>

    <!-- Custom App 4 -->
    <a href="https://your-fourth-app-url.com"
       class="app-button"
       data-app="Custom App 4">
      <span class="icon">⚙️</span>
      <span>Custom App 4</span>
    </a>

  </div>

  <script>
    const statusText =
      document.getElementById("status");

    const appButtons =
      document.querySelectorAll(".app-button");

    // Show which app currently has focus
    document.addEventListener("focusin", function(event) {
      const button = event.target.closest(".app-button");

      if (button) {
        statusText.textContent =
          "Selected: " + button.dataset.app;
      }
    });

    // Handle Neural Band pinch (Enter)
    document.addEventListener("keydown", function(event) {
      if (event.key !== "Enter") {
        return;
      }

      const selectedApp = document.activeElement;

      if (selectedApp &&
          selectedApp.classList.contains("app-button")) {

        event.preventDefault();

        statusText.textContent =
          "Opening: " + selectedApp.dataset.app;

        window.location.assign(selectedApp.href);
      }
    });

    // Standard mouse/touch navigation
    appButtons.forEach(function(button) {
      button.addEventListener("click", function() {
        statusText.textContent =
          "Opening: " + button.dataset.app;
      });
    });
  </script>

</body>
</html>
