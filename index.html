<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>My Glasses Launcher</title>

  <style>
    /* Force Dark Mode */
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: #000000;
      color: #ffffff;
    }

    body {
      width: 600px;
      height: 600px;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial,
        sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
      color: #ffffff;
    }

    /* 2x2 Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 15px;
      flex-grow: 1;
      min-height: 0;
    }

    /* Dark Buttons */
    .app-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #111111;
      border: 2px solid #333333;
      border-radius: 16px;
      color: #ffffff;
      text-decoration: none;
      font-size: 22px;
      font-weight: 500;
      text-align: center;
      padding: 10px;
      transition: background-color 0.2s,
                  border-color 0.2s;
    }

    .app-button:visited {
      color: #ffffff;
    }

    .app-button:hover,
    .app-button:focus-visible {
      background-color: #222222;
      border-color: #ffffff;
    }

    .app-button:active {
      background-color: #444444;
      color: #ffffff;
      border-color: #ffffff;
    }

    .icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .icon img {
      width: 256px;
      height: 256px;
      object-fit: contain;
    }
  </style>
</head>
